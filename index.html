<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jerseys Premium 🎽</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #0f0f0f;
    color: #fff;
    min-height: 100vh;
  }

  /* ── PANTALLA LOGIN ── */
  #login-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    background: linear-gradient(135deg, #0f0f0f 0%, #1a1a2e 100%);
  }
  .login-box {
    background: #1e1e1e;
    border: 1px solid #333;
    border-radius: 16px;
    padding: 36px 28px;
    width: 100%;
    max-width: 380px;
    text-align: center;
  }
  .login-box .emoji { font-size: 52px; margin-bottom: 12px; }
  .login-box h1 { font-size: 24px; font-weight: 700; margin-bottom: 6px; }
  .login-box p  { color: #999; font-size: 14px; margin-bottom: 28px; }

  .tabs { display: flex; gap: 0; margin-bottom: 24px; border-radius: 8px; overflow: hidden; border: 1px solid #333; }
  .tab-btn {
    flex: 1; padding: 10px; background: #111; color: #888;
    border: none; cursor: pointer; font-size: 14px; font-weight: 600; transition: all .2s;
  }
  .tab-btn.active { background: #e63946; color: #fff; }

  .field-group { margin-bottom: 16px; text-align: left; }
  .field-group label { display: block; font-size: 12px; color: #aaa; margin-bottom: 6px; font-weight: 600; letter-spacing: .5px; }
  .field-group input {
    width: 100%; padding: 12px 14px; background: #111; border: 1px solid #333;
    border-radius: 8px; color: #fff; font-size: 15px; outline: none; transition: border .2s;
  }
  .field-group input:focus { border-color: #e63946; }

  .btn-primary {
    width: 100%; padding: 14px; background: #e63946; color: #fff;
    border: none; border-radius: 10px; font-size: 16px; font-weight: 700;
    cursor: pointer; transition: background .2s; margin-top: 4px;
  }
  .btn-primary:hover { background: #c1121f; }
  #login-error { color: #ff6b6b; font-size: 13px; margin-top: 12px; min-height: 18px; }

  /* ── APP PRINCIPAL ── */
  #app { display: none; }

  /* Header */
  .header {
    background: #1a1a1a;
    border-bottom: 1px solid #2a2a2a;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
  }
  .header-left { display: flex; align-items: center; gap: 10px; }
  .header-left .logo { font-size: 22px; }
  .header-left h2 { font-size: 17px; font-weight: 700; }
  .header-right { display: flex; align-items: center; gap: 10px; }
  .user-info { text-align: right; }
  .user-info .uname { font-size: 13px; font-weight: 600; }
  .user-info .urole { font-size: 11px; color: #e63946; }
  .btn-logout {
    background: #2a2a2a; border: 1px solid #444; color: #ccc;
    padding: 7px 14px; border-radius: 8px; font-size: 13px; cursor: pointer;
  }
  .btn-admin {
    background: #e63946; border: none; color: #fff;
    padding: 7px 14px; border-radius: 8px; font-size: 13px; cursor: pointer; font-weight: 600;
  }

  /* Contenido */
  .content { padding: 24px 16px; max-width: 900px; margin: 0 auto; }

  .section-title {
    font-size: 13px; font-weight: 700; color: #e63946;
    letter-spacing: 1.5px; text-transform: uppercase;
    margin-bottom: 14px; margin-top: 28px;
    padding-bottom: 6px; border-bottom: 1px solid #2a2a2a;
  }
  .section-title:first-child { margin-top: 0; }

  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 12px;
  }

  .card {
    background: #1e1e1e;
    border: 1px solid #2a2a2a;
    border-radius: 12px;
    overflow: hidden;
    transition: transform .2s, border-color .2s;
  }
  .card:hover { transform: translateY(-2px); border-color: #e63946; }

  .card-body { padding: 16px; }
  .card-name { font-size: 15px; font-weight: 700; margin-bottom: 4px; line-height: 1.3; }
  .card-sub  { font-size: 12px; color: #888; margin-bottom: 14px; }
  .card-note { font-size: 11px; color: #e8a045; background: #2a2000; padding: 5px 8px; border-radius: 6px; margin-bottom: 12px; }

  .card-actions { display: flex; gap: 8px; }
  .btn-ver {
    flex: 1; padding: 10px; background: #2a2a2a; color: #fff;
    border: none; border-radius: 8px; font-size: 13px; font-weight: 600;
    cursor: pointer; text-decoration: none; text-align: center;
    transition: background .2s; display: block;
  }
  .btn-ver:hover { background: #3a3a3a; }
  .btn-wa {
    padding: 10px 14px; background: #25d366; color: #fff;
    border: none; border-radius: 8px; font-size: 18px;
    cursor: pointer; text-decoration: none; display: block;
    transition: background .2s;
  }
  .btn-wa:hover { background: #1da851; }

  /* Panel Admin */
  #admin-panel {
    display: none;
    position: fixed; inset: 0; background: rgba(0,0,0,.8);
    z-index: 200; align-items: center; justify-content: center; padding: 20px;
  }
  #admin-panel.show { display: flex; }
  .admin-box {
    background: #1e1e1e; border: 1px solid #333; border-radius: 16px;
    padding: 28px; width: 100%; max-width: 500px; max-height: 80vh; overflow-y: auto;
  }
  .admin-box h2 { font-size: 18px; margin-bottom: 20px; }
  .admin-close { float: right; background: none; border: none; color: #fff; font-size: 22px; cursor: pointer; }
  .user-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px; background: #111; border-radius: 8px; margin-bottom: 8px;
  }
  .user-row-info .urow-name { font-size: 14px; font-weight: 600; }
  .user-row-info .urow-tel  { font-size: 12px; color: #888; }
  .btn-del {
    background: #c1121f; border: none; color: #fff;
    padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer;
  }
  .admin-empty { color: #666; font-size: 14px; text-align: center; padding: 20px; }

  @media(max-width:480px){
    .cards-grid { grid-template-columns: 1fr; }
    .content { padding: 16px 12px; }
  }
</style>
</head>
<body>

<!-- ═══ LOGIN ═══ -->
<div id="login-screen">
  <div class="login-box">
    <div class="emoji">🎽</div>
    <h1>Jerseys Premium</h1>
    <p>Accede al catálogo exclusivo</p>

    <div class="tabs">
      <button class="tab-btn active" onclick="showTab('login')">Entrar</button>
      <button class="tab-btn"        onclick="showTab('register')">Registrarme</button>
    </div>

    <!-- Tab Login -->
    <div id="tab-login">
      <div class="field-group">
        <label>TELÉFONO</label>
        <input type="tel" id="l-phone" placeholder="10 dígitos" maxlength="10">
      </div>
      <div class="field-group">
        <label>CONTRASEÑA</label>
        <input type="password" id="l-pass" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      <button class="btn-primary" onclick="doLogin()">Entrar al catálogo →</button>
    </div>

    <!-- Tab Registro -->
    <div id="tab-register" style="display:none">
      <div class="field-group">
        <label>NOMBRE COMPLETO</label>
        <input type="text" id="r-name" placeholder="Tu nombre">
      </div>
      <div class="field-group">
        <label>TELÉFONO</label>
        <input type="tel" id="r-phone" placeholder="10 dígitos" maxlength="10">
      </div>
      <div class="field-group">
        <label>CONTRASEÑA</label>
        <input type="password" id="r-pass" placeholder="Elige una contraseña">
      </div>
      <button class="btn-primary" onclick="doRegister()">Crear cuenta →</button>
    </div>

    <div id="login-error"></div>
  </div>
</div>

<!-- ═══ APP ═══ -->
<div id="app">

  <div class="header">
    <div class="header-left">
      <span class="logo">🎽</span>
      <h2>Jerseys Premium</h2>
    </div>
    <div class="header-right">
      <div class="user-info">
        <div class="uname" id="hdr-name"></div>
        <div class="urole" id="hdr-role"></div>
      </div>
      <button class="btn-admin" id="btn-admin" style="display:none" onclick="openAdmin()">⚙ Admin</button>
      <button class="btn-logout" onclick="doLogout()">Salir</button>
    </div>
  </div>

  <div class="content" id="catalog-content">
    <!-- generado por JS -->
  </div>

</div>

<!-- ═══ PANEL ADMIN ═══ -->
<div id="admin-panel">
  <div class="admin-box">
    <button class="admin-close" onclick="closeAdmin()">✕</button>
    <h2>👥 Usuarios registrados</h2>
    <div id="admin-users-list"></div>
  </div>
</div>

<script src="catalog_links.js"></script>
<script>
var ADMIN_PHONE = '3343745531';
var ADMIN_PASS  = '125670Carlos';
var ADMIN_NAME  = 'Carlos Adrian Luevano Alatorre';
var WA_NUMBER   = '523343745531';

// ── STORAGE ──
function loadUsers() {
  try { return JSON.parse(localStorage.getItem('jUsers') || '{}'); } catch(e){ return {}; }
}
function saveUsers(u) {
  localStorage.setItem('jUsers', JSON.stringify(u));
}
function getSession() {
  try { return JSON.parse(sessionStorage.getItem('jSess') || 'null'); } catch(e){ return null; }
}
function setSession(s) {
  sessionStorage.setItem('jSess', JSON.stringify(s));
}

// ── TABS ──
function showTab(t) {
  document.getElementById('tab-login').style.display    = t==='login'    ? '' : 'none';
  document.getElementById('tab-register').style.display = t==='register' ? '' : 'none';
  document.querySelectorAll('.tab-btn').forEach(function(b,i){
    b.classList.toggle('active', (t==='login' && i===0) || (t==='register' && i===1));
  });
  document.getElementById('login-error').textContent = '';
}

// ── LOGIN ──
function doLogin() {
  var phone = (document.getElementById('l-phone').value || '').trim();
  var pass  = (document.getElementById('l-pass').value  || '').trim();
  var err   = document.getElementById('login-error');
  err.textContent = '';

  if (phone.length < 7) { err.textContent = 'Ingresa tu telefono.'; return; }
  if (!pass)            { err.textContent = 'Ingresa tu contrasena.'; return; }

  // Admin
  if (phone === ADMIN_PHONE) {
    if (pass !== ADMIN_PASS) { err.textContent = 'Contrasena incorrecta.'; return; }
    setSession({ phone: ADMIN_PHONE, name: ADMIN_NAME, role: 'admin' });
    enterApp({ phone: ADMIN_PHONE, name: ADMIN_NAME, role: 'admin' });
    return;
  }

  // Usuario normal
  var users = loadUsers();
  if (!users[phone]) { err.textContent = 'Numero no registrado. Usa "Registrarme".'; return; }
  if (users[phone].pass !== pass) { err.textContent = 'Contrasena incorrecta.'; return; }
  var sess = { phone: phone, name: users[phone].name, role: 'user' };
  setSession(sess);
  enterApp(sess);
}

// ── REGISTRO ──
function doRegister() {
  var name  = (document.getElementById('r-name').value  || '').trim();
  var phone = (document.getElementById('r-phone').value || '').trim();
  var pass  = (document.getElementById('r-pass').value  || '').trim();
  var err   = document.getElementById('login-error');
  err.textContent = '';

  if (!name)             { err.textContent = 'Ingresa tu nombre.'; return; }
  if (phone.length < 7)  { err.textContent = 'Ingresa tu telefono.'; return; }
  if (pass.length < 4)   { err.textContent = 'Contrasena minimo 4 caracteres.'; return; }
  if (phone === ADMIN_PHONE) { err.textContent = 'Numero no disponible.'; return; }

  var users = loadUsers();
  if (users[phone]) { err.textContent = 'Ya existe cuenta con ese numero.'; return; }

  users[phone] = { name: name, pass: pass, ts: Date.now() };
  saveUsers(users);
  var sess = { phone: phone, name: name, role: 'user' };
  setSession(sess);
  enterApp(sess);
}

// ── ENTRAR APP ──
function enterApp(sess) {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('hdr-name').textContent = sess.name;
  document.getElementById('hdr-role').textContent = sess.role === 'admin' ? 'Administrador' : 'Cliente';
  if (sess.role === 'admin') {
    document.getElementById('btn-admin').style.display = '';
  }
  renderCatalog();
}

// ── LOGOUT ──
function doLogout() {
  sessionStorage.removeItem('jSess');
  location.reload();
}

// ── RENDER CATALOGO ──
function renderCatalog() {
  var container = document.getElementById('catalog-content');
  if (!window.CATALOG_LINKS) {
    container.innerHTML = '<p style="color:#888;padding:20px">Cargando...</p>';
    return;
  }
  var html = '';
  window.CATALOG_LINKS.forEach(function(section) {
    html += '<div class="section-title">' + section.category + '</div>';
    html += '<div class="cards-grid">';
    section.links.forEach(function(item) {
      var waMsg = encodeURIComponent('Hola, me interesa ver: ' + item.name);
      var note = item.note ? '<div class="card-note">Contrasena: ' + item.note + '</div>' : '';
      html += '<div class="card"><div class="card-body">' +
        '<div class="card-name">' + item.name + '</div>' +
        '<div class="card-sub">' + section.category + '</div>' +
        note +
        '<div class="card-actions">' +
        '<a class="btn-ver" href="' + item.url + '" target="_blank" rel="noopener">Ver catalogo</a>' +
        '<a class="btn-wa" href="https://wa.me/' + WA_NUMBER + '?text=' + waMsg + '" target="_blank" rel="noopener">💬</a>' +
        '</div></div></div>';
    });
    html += '</div>';
  });
  container.innerHTML = html;
}

// ── ADMIN PANEL ──
function openAdmin() {
  var users = loadUsers();
  var keys = Object.keys(users);
  var html = keys.length === 0
    ? '<div class="admin-empty">Sin usuarios registrados aun.</div>'
    : '';
  keys.forEach(function(phone) {
    var u = users[phone];
    html += '<div class="user-row">' +
      '<div class="user-row-info">' +
        '<div class="urow-name">' + u.name + '</div>' +
        '<div class="urow-tel">' + phone + '</div>' +
      '</div>' +
      '<button class="btn-del" onclick="deleteUser(\'' + phone + '\')">Eliminar</button>' +
    '</div>';
  });
  document.getElementById('admin-users-list').innerHTML = html;
  document.getElementById('admin-panel').classList.add('show');
}
function closeAdmin() {
  document.getElementById('admin-panel').classList.remove('show');
}
function deleteUser(phone) {
  var users = loadUsers();
  delete users[phone];
  saveUsers(users);
  openAdmin();
}

// ── AUTO-LOGIN ──
(function(){
  var sess = getSession();
  if (sess && sess.phone) { enterApp(sess); }
})();
</script>
</body>
</html>
