<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo de Jerseys</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#0f0f0f;color:#fff;min-height:100vh}

/* ── LOGIN ── */
#login-screen{
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);
}
.login-box{
  background:rgba(255,255,255,.07);backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.15);border-radius:20px;
  padding:40px 36px;width:100%;max-width:400px;text-align:center;
}
.login-box .logo{font-size:42px;margin-bottom:8px}
.login-box h2{font-size:22px;font-weight:700;margin-bottom:4px}
.login-box p.sub{color:#aaa;font-size:13px;margin-bottom:28px}
.tabs{display:flex;gap:8px;margin-bottom:24px;background:rgba(0,0,0,.3);border-radius:10px;padding:4px}
.tab{flex:1;padding:8px;border:none;background:transparent;color:#aaa;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;transition:.2s}
.tab.active{background:#e63946;color:#fff}
.input-group{margin-bottom:14px;text-align:left}
.input-group label{font-size:12px;color:#aaa;display:block;margin-bottom:5px}
.input-group input{
  width:100%;padding:12px 14px;background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.15);border-radius:10px;color:#fff;font-size:15px;outline:none;
  transition:.2s
}
.input-group input:focus{border-color:#e63946;background:rgba(255,255,255,.12)}
.btn-login{
  width:100%;padding:14px;background:#e63946;color:#fff;border:none;border-radius:12px;
  font-size:16px;font-weight:700;cursor:pointer;margin-top:6px;transition:.2s;
}
.btn-login:hover{background:#c1121f}
.login-error{color:#ff6b6b;font-size:13px;margin-top:10px;min-height:18px}
.login-toggle{color:#aaa;font-size:13px;margin-top:16px}
.login-toggle span{color:#e63946;cursor:pointer;font-weight:600}

/* ── APP ── */
#app{display:none;flex-direction:column;min-height:100vh}

/* header */
.header{
  background:#111;border-bottom:1px solid #222;
  padding:12px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;
}
.header .logo-txt{font-size:20px;font-weight:800;color:#e63946;flex-shrink:0}
.search-wrap{flex:1;position:relative}
.search-wrap input{
  width:100%;padding:9px 14px 9px 36px;background:#1e1e1e;border:1px solid #333;
  border-radius:10px;color:#fff;font-size:14px;outline:none
}
.search-wrap input:focus{border-color:#e63946}
.search-wrap .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#666;font-size:16px}
.header-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
.user-badge{
  background:#1e1e1e;border:1px solid #333;border-radius:20px;
  padding:6px 12px;font-size:12px;display:flex;align-items:center;gap:6px;cursor:pointer;
}
.user-badge .av{
  width:26px;height:26px;border-radius:50%;background:#e63946;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;
}
#logout-btn{background:#222;border:1px solid #444;color:#aaa;padding:6px 12px;border-radius:8px;font-size:12px;cursor:pointer}
#logout-btn:hover{background:#e63946;color:#fff;border-color:#e63946}
#admin-btn{background:#f4a261;color:#000;border:none;padding:6px 12px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer}

/* categorías */
.cats{
  background:#111;border-bottom:1px solid #222;
  padding:10px 16px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;
}
.cats::-webkit-scrollbar{display:none}
.cat-btn{
  flex-shrink:0;padding:7px 16px;border-radius:20px;border:1px solid #333;
  background:transparent;color:#aaa;font-size:13px;cursor:pointer;white-space:nowrap;transition:.2s;
}
.cat-btn:hover{border-color:#e63946;color:#fff}
.cat-btn.active{background:#e63946;border-color:#e63946;color:#fff;font-weight:700}

/* grilla */
.main{flex:1;padding:16px}
.count-bar{font-size:13px;color:#888;margin-bottom:14px}
.count-bar span{color:#e63946;font-weight:700}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:14px;
}
@media(min-width:600px){.grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}}

/* card */
.card{
  background:#1a1a1a;border:1px solid #2a2a2a;border-radius:14px;
  overflow:hidden;transition:.2s;cursor:pointer;
}
.card:hover{transform:translateY(-3px);border-color:#e63946;box-shadow:0 8px 24px rgba(230,57,70,.2)}
.card img{width:100%;aspect-ratio:1;object-fit:cover;background:#111;display:block}
.card-body{padding:10px 12px 12px}
.card-name{font-size:13px;font-weight:600;color:#eee;line-height:1.3;margin-bottom:4px}
.card-cat{font-size:11px;color:#888;margin-bottom:8px}
.card-price{font-size:15px;font-weight:800;color:#e63946;margin-bottom:8px}
.card-price.empty{color:#555;font-style:italic;font-size:12px;font-weight:400}
.btn-wa{
  display:flex;align-items:center;justify-content:center;gap:6px;
  width:100%;padding:8px;background:#25d366;color:#fff;border:none;border-radius:8px;
  font-size:13px;font-weight:700;cursor:pointer;text-decoration:none;transition:.2s;
}
.btn-wa:hover{background:#128c7e}

/* modal */
.modal-overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;
  align-items:center;justify-content:center;padding:16px;
}
.modal-overlay.open{display:flex}
.modal{
  background:#1a1a1a;border:1px solid #333;border-radius:18px;
  max-width:480px;width:100%;max-height:90vh;overflow-y:auto;
}
.modal-img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:18px 18px 0 0}
.modal-body{padding:20px}
.modal-body h3{font-size:18px;font-weight:800;margin-bottom:4px}
.modal-cat{font-size:12px;color:#888;margin-bottom:10px}
.modal-price{font-size:22px;font-weight:800;color:#e63946;margin-bottom:12px}
.modal-desc{font-size:14px;color:#bbb;margin-bottom:16px;line-height:1.5}
.modal-close{
  position:absolute;top:12px;right:16px;background:#333;border:none;color:#fff;
  font-size:20px;width:34px;height:34px;border-radius:50%;cursor:pointer;z-index:10;
}
.modal-wrap{position:relative}

/* panel admin */
.admin-panel{
  display:none;position:fixed;inset:0;background:#111;z-index:300;overflow-y:auto;padding:20px;
}
.admin-panel.open{display:block}
.admin-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.admin-header h2{font-size:20px;font-weight:800}
.btn-close-admin{background:#333;border:none;color:#fff;padding:8px 16px;border-radius:8px;cursor:pointer}
.user-table{width:100%;border-collapse:collapse;font-size:13px}
.user-table th{background:#222;padding:10px;text-align:left;color:#aaa}
.user-table td{padding:10px;border-bottom:1px solid #222;color:#ddd}
.btn-del{background:#e63946;border:none;color:#fff;padding:4px 10px;border-radius:6px;cursor:pointer;font-size:12px}

/* empty */
.empty{text-align:center;padding:60px 20px;color:#555}
.empty .ic{font-size:48px;margin-bottom:12px}
</style>
</head>
<body>

<!-- ═══════════ LOGIN ═══════════ -->
<div id="login-screen">
  <div class="login-box">
    <div class="logo">🎽</div>
    <h2>Jerseys Premium</h2>
    <p class="sub">Accede a nuestro catálogo exclusivo</p>

    <div class="tabs">
      <button class="tab active" onclick="showTab('login')">Entrar</button>
      <button class="tab" onclick="showTab('register')">Registrarme</button>
    </div>

    <!-- Login -->
    <div id="tab-login">
      <div class="input-group">
        <label>Teléfono</label>
        <input type="tel" id="l-phone" placeholder="10 dígitos" maxlength="10" oninput="this.value=this.value.replace(/\D/g,'')">
      </div>
      <div class="input-group">
        <label>Contraseña</label>
        <input type="password" id="l-pass" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      <button class="btn-login" onclick="doLogin()">Entrar al catálogo →</button>
      <div class="login-error" id="l-err"></div>
    </div>

    <!-- Registro -->
    <div id="tab-register" style="display:none">
      <div class="input-group">
        <label>Nombre completo</label>
        <input type="text" id="r-name" placeholder="Tu nombre">
      </div>
      <div class="input-group">
        <label>Teléfono</label>
        <input type="tel" id="r-phone" placeholder="10 dígitos" maxlength="10" oninput="this.value=this.value.replace(/\D/g,'')">
      </div>
      <div class="input-group">
        <label>Contraseña</label>
        <input type="password" id="r-pass" placeholder="Mínimo 6 caracteres" onkeydown="if(event.key==='Enter')doRegister()">
      </div>
      <button class="btn-login" onclick="doRegister()">Crear cuenta</button>
      <div class="login-error" id="r-err"></div>
    </div>
  </div>
</div>

<!-- ═══════════ APP ═══════════ -->
<div id="app">

  <!-- Header -->
  <div class="header">
    <div class="logo-txt">🎽 Jerseys</div>
    <div class="search-wrap">
      <span class="ic">🔍</span>
      <input type="text" id="search-input" placeholder="Buscar jerseys..." oninput="applyFilters()">
    </div>
    <div class="header-right">
      <div class="user-badge" id="user-badge">
        <div class="av" id="user-avatar">?</div>
        <span id="user-name-display">Usuario</span>
      </div>
      <button id="admin-btn" style="display:none" onclick="openAdmin()">⚙ Admin</button>
      <button id="logout-btn" onclick="doLogout()">Salir</button>
    </div>
  </div>

  <!-- Categorías -->
  <div class="cats" id="cats-bar">
    <button class="cat-btn active" onclick="selectCat('Todos',this)">Todos</button>
  </div>

  <!-- Main -->
  <div class="main">
    <div class="count-bar" id="count-bar"></div>
    <div class="grid" id="products-grid"></div>
  </div>
</div>

<!-- Modal producto -->
<div class="modal-overlay" id="modal" onclick="closeModal(event)">
  <div class="modal-wrap">
    <button class="modal-close" onclick="document.getElementById('modal').classList.remove('open')">✕</button>
    <div class="modal">
      <img id="modal-img" src="" alt="">
      <div class="modal-body">
        <h3 id="modal-name"></h3>
        <div class="modal-cat" id="modal-cat"></div>
        <div class="modal-price" id="modal-price"></div>
        <div class="modal-desc" id="modal-desc"></div>
        <a class="btn-wa" id="modal-wa" target="_blank">
          <span>📲</span> Pedir por WhatsApp
        </a>
      </div>
    </div>
  </div>
</div>

<!-- Panel admin -->
<div class="admin-panel" id="admin-panel">
  <div class="admin-header">
    <h2>⚙ Panel Admin</h2>
    <button class="btn-close-admin" onclick="closeAdmin()">✕ Cerrar</button>
  </div>
  <div id="admin-content"></div>
</div>

<script src="catalog.js"></script>
<script>
// ─── CONFIGURACIÓN ───────────────────────────────
var ADMIN_PHONE = '3343745531';
var ADMIN_PASS  = '125670Carlos';
var ADMIN_NAME  = 'Carlos';
var WA_NUMBER   = '523343745531';
var STORE_KEY   = 'jersey_users';
var SESSION_KEY = 'jersey_session';

// ─── ESTADO ──────────────────────────────────────
var currentCat   = 'Todos';
var currentUser  = null;
var allProducts  = [];

// ─── UTILIDADES DE STORAGE ───────────────────────
function getUsers() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY) || '[]'); } catch(e) { return []; }
}
function saveUsers(u) {
  localStorage.setItem(STORE_KEY, JSON.stringify(u));
}
function getSession() {
  try { return JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); } catch(e) { return null; }
}
function saveSession(s) {
  localStorage.setItem(SESSION_KEY, JSON.stringify(s));
}

// ─── TABS LOGIN ───────────────────────────────────
function showTab(t) {
  document.getElementById('tab-login').style.display    = t==='login'    ? '' : 'none';
  document.getElementById('tab-register').style.display = t==='register' ? '' : 'none';
  document.querySelectorAll('.tab').forEach(function(b,i){
    b.classList.toggle('active', (t==='login' && i===0)||(t==='register' && i===1));
  });
}

// ─── LOGIN ────────────────────────────────────────
function doLogin() {
  var phone = document.getElementById('l-phone').value.trim();
  var pass  = document.getElementById('l-pass').value;
  var err   = document.getElementById('l-err');
  err.textContent = '';

  if (phone.length < 7) { err.textContent = 'Ingresa tu teléfono.'; return; }
  if (!pass)            { err.textContent = 'Ingresa tu contraseña.'; return; }

  // Admin
  if (phone === ADMIN_PHONE) {
    if (pass !== ADMIN_PASS) { err.textContent = 'Contraseña incorrecta.'; return; }
    saveSession({ phone: ADMIN_PHONE, name: ADMIN_NAME, isAdmin: true });
    enterApp({ phone: ADMIN_PHONE, name: ADMIN_NAME, isAdmin: true });
    return;
  }

  // Usuario normal
  var users = getUsers();
  var user  = users.find(function(u){ return u.phone === phone; });
  if (!user)        { err.textContent = 'Teléfono no registrado.'; return; }
  if (user.pass !== pass) { err.textContent = 'Contraseña incorrecta.'; return; }
  saveSession(user);
  enterApp(user);
}

// ─── REGISTRO ────────────────────────────────────
function doRegister() {
  var name  = document.getElementById('r-name').value.trim();
  var phone = document.getElementById('r-phone').value.trim();
  var pass  = document.getElementById('r-pass').value;
  var err   = document.getElementById('r-err');
  err.textContent = '';

  if (!name)            { err.textContent = 'Ingresa tu nombre.'; return; }
  if (phone.length < 7) { err.textContent = 'Ingresa tu teléfono.'; return; }
  if (pass.length < 6)  { err.textContent = 'Contraseña mínimo 6 caracteres.'; return; }
  if (phone === ADMIN_PHONE) { err.textContent = 'Teléfono no disponible.'; return; }

  var users = getUsers();
  if (users.find(function(u){ return u.phone === phone; })) {
    err.textContent = 'Ese teléfono ya está registrado.'; return;
  }
  var user = { phone: phone, name: name, pass: pass, isAdmin: false, date: new Date().toISOString() };
  users.push(user);
  saveUsers(users);
  saveSession(user);
  enterApp(user);
}

// ─── ENTRAR AL APP ───────────────────────────────
function enterApp(user) {
  currentUser = user;
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display          = 'flex';
  document.getElementById('user-avatar').textContent    = user.name.charAt(0).toUpperCase();
  document.getElementById('user-name-display').textContent = user.name;
  if (user.isAdmin) document.getElementById('admin-btn').style.display = '';
  initCatalog();
}

// ─── LOGOUT ──────────────────────────────────────
function doLogout() {
  localStorage.removeItem(SESSION_KEY);
  currentUser = null;
  currentCat  = 'Todos';
  document.getElementById('app').style.display          = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('l-phone').value = '';
  document.getElementById('l-pass').value  = '';
  document.getElementById('l-err').textContent = '';
}

// ─── CATÁLOGO ────────────────────────────────────
function initCatalog() {
  allProducts = window.CATALOG_SEED || [];
  buildCatBar();
  applyFilters();
}

function buildCatBar() {
  var cats = ['Todos'];
  allProducts.forEach(function(p){
    if (p.category && cats.indexOf(p.category) < 0) cats.push(p.category);
  });
  var bar = document.getElementById('cats-bar');
  bar.innerHTML = '';
  cats.forEach(function(cat){
    var b = document.createElement('button');
    b.className  = 'cat-btn' + (cat === currentCat ? ' active' : '');
    b.textContent = cat;
    b.onclick    = function(){ selectCat(cat, b); };
    bar.appendChild(b);
  });
}

function selectCat(cat, btn) {
  currentCat = cat;
  document.querySelectorAll('.cat-btn').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  applyFilters();
}

function applyFilters() {
  var q = (document.getElementById('search-input').value || '').toLowerCase().trim();
  var filtered = allProducts.filter(function(p){
    var matchCat  = currentCat === 'Todos' || p.category === currentCat;
    var matchQ    = !q || p.name.toLowerCase().includes(q) || (p.category||'').toLowerCase().includes(q);
    return matchCat && matchQ;
  });
  renderGrid(filtered);
  document.getElementById('count-bar').innerHTML =
    '<span>' + filtered.length + '</span> jerseys' +
    (currentCat !== 'Todos' ? ' en ' + currentCat : '');
}

function renderGrid(products) {
  var grid = document.getElementById('products-grid');
  if (!products.length) {
    grid.innerHTML = '<div class="empty"><div class="ic">🔍</div><p>Sin resultados</p></div>';
    return;
  }
  grid.innerHTML = products.map(function(p){
    var img    = p.image_thumb || p.thumb || p.image || '';
    var price  = p.price ? '<div class="card-price">$' + p.price + '</div>' : '<div class="card-price empty">Precio al consultar</div>';
    var msg    = encodeURIComponent('Hola, me interesa este jersey: ' + p.name + (p.price ? ' ($' + p.price + ')' : ''));
    var waLink = 'https://wa.me/' + WA_NUMBER + '?text=' + msg;
    return '<div class="card" onclick="openModal(' + p.id + ')">' +
      '<img src="' + img + '" alt="' + p.name + '" loading="lazy" onerror="this.src=\'\'">' +
      '<div class="card-body">' +
        '<div class="card-name">' + p.name + '</div>' +
        '<div class="card-cat">' + (p.category||'') + '</div>' +
        price +
        '<a class="btn-wa" href="' + waLink + '" target="_blank" onclick="event.stopPropagation()">📲 Pedir</a>' +
      '</div></div>';
  }).join('');
}

// ─── MODAL ───────────────────────────────────────
function openModal(id) {
  var p = allProducts.find(function(x){ return x.id === id; });
  if (!p) return;
  var msg    = encodeURIComponent('Hola, me interesa este jersey: ' + p.name + (p.price ? ' ($' + p.price + ')' : ''));
  document.getElementById('modal-img').src             = p.image || p.image_thumb || '';
  document.getElementById('modal-name').textContent    = p.name;
  document.getElementById('modal-cat').textContent     = p.category || '';
  document.getElementById('modal-price').textContent   = p.price ? '$' + p.price : 'Precio al consultar';
  document.getElementById('modal-price').className     = 'modal-price' + (p.price ? '' : ' empty');
  document.getElementById('modal-desc').textContent    = p.description || '';
  document.getElementById('modal-wa').href             = 'https://wa.me/' + WA_NUMBER + '?text=' + msg;
  document.getElementById('modal').classList.add('open');
}

function closeModal(e) {
  if (e.target === document.getElementById('modal')) {
    document.getElementById('modal').classList.remove('open');
  }
}

// ─── ADMIN ───────────────────────────────────────
function openAdmin() {
  var users = getUsers();
  var rows  = users.length ? users.map(function(u, i){
    return '<tr><td>' + u.name + '</td><td>' + u.phone + '</td><td>' + (u.date||'').slice(0,10) + '</td>' +
      '<td><button class="btn-del" onclick="delUser(' + i + ')">Eliminar</button></td></tr>';
  }).join('') : '<tr><td colspan="4" style="color:#555;text-align:center;padding:20px">Sin usuarios registrados</td></tr>';
  document.getElementById('admin-content').innerHTML =
    '<p style="color:#aaa;margin-bottom:16px">Total usuarios: <strong style="color:#fff">' + users.length + '</strong></p>' +
    '<table class="user-table"><thead><tr><th>Nombre</th><th>Teléfono</th><th>Registro</th><th></th></tr></thead><tbody>' + rows + '</tbody></table>';
  document.getElementById('admin-panel').classList.add('open');
}

function delUser(i) {
  if (!confirm('¿Eliminar este usuario?')) return;
  var users = getUsers();
  users.splice(i, 1);
  saveUsers(users);
  openAdmin();
}

function closeAdmin() {
  document.getElementById('admin-panel').classList.remove('open');
}

// ─── INICIO ──────────────────────────────────────
(function init(){
  var sess = getSession();
  if (sess && sess.phone) {
    enterApp(sess);
  }
})();
</script>
</body>
</html>
