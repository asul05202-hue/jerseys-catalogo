*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#0f0f0f;color:#fff;min-height:100vh}

/* LOGIN */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;background:linear-gradient(135deg,#0f0f0f,#1a1a2e)}
.login-box{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:18px;padding:36px 28px;width:100%;max-width:370px;text-align:center}
.login-box .ico{font-size:54px;margin-bottom:10px}
.login-box h1{font-size:22px;font-weight:800;margin-bottom:4px}
.login-box .sub{color:#777;font-size:13px;margin-bottom:26px}
.tabs{display:flex;border:1px solid #333;border-radius:10px;overflow:hidden;margin-bottom:22px}
.tab-btn{flex:1;padding:11px;background:#111;color:#888;border:none;cursor:pointer;font-size:14px;font-weight:700;transition:all .2s}
.tab-btn.active{background:#e63946;color:#fff}
.field{margin-bottom:14px;text-align:left}
.field label{display:block;font-size:11px;color:#aaa;font-weight:700;letter-spacing:.6px;margin-bottom:5px}
.field input{width:100%;padding:12px 14px;background:#111;border:1px solid #2a2a2a;border-radius:8px;color:#fff;font-size:15px;outline:none;transition:border .2s}
.field input:focus{border-color:#e63946}
.btn-main{width:100%;padding:14px;background:#e63946;color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:800;cursor:pointer;margin-top:6px;transition:background .2s}
.btn-main:hover{background:#c1121f}
#login-err{color:#ff6b6b;font-size:13px;margin-top:12px;min-height:16px}

/* APP */
#app{display:none}
.header{background:#161616;border-bottom:2px solid #e63946;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.hdr-left{display:flex;align-items:center;gap:10px}
.hdr-left .ico2{font-size:24px}
.hdr-left h2{font-size:16px;font-weight:800}
.hdr-right{display:flex;align-items:center;gap:8px}
.uinfo{text-align:right;line-height:1.3}
.uinfo .un{font-size:13px;font-weight:700}
.uinfo .ur{font-size:11px;color:#e63946}
.btn-sm{padding:7px 13px;border-radius:8px;border:none;cursor:pointer;font-size:12px;font-weight:700;transition:all .2s}
.btn-logout{background:#2a2a2a;color:#bbb}
.btn-logout:hover{background:#333}
.btn-admin-hdr{background:#e63946;color:#fff}
.btn-admin-hdr:hover{background:#c1121f}

/* CONTENT */
.content{padding:20px 14px;max-width:920px;margin:0 auto}
.sec-title{font-size:11px;font-weight:800;color:#e63946;letter-spacing:1.8px;text-transform:uppercase;padding:8px 0 10px;border-bottom:1px solid #222;margin:28px 0 14px}
.sec-title:first-child{margin-top:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.card{background:#1a1a1a;border:1px solid #252525;border-radius:12px;padding:16px;transition:border-color .2s,transform .15s}
.card:hover{border-color:#e63946;transform:translateY(-2px)}
.card-name{font-size:14px;font-weight:700;margin-bottom:3px;line-height:1.4}
.card-cat{font-size:11px;color:#777;margin-bottom:10px}
.card-note{font-size:11px;color:#f4a261;background:#1f1200;border-radius:6px;padding:4px 8px;margin-bottom:10px;display:inline-block}
.card-btns{display:flex;gap:7px;margin-top:10px}
.btn-ver{flex:1;padding:9px;background:#222;color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:700;text-decoration:none;text-align:center;cursor:pointer;transition:background .2s}
.btn-ver:hover{background:#333}
.btn-wa{padding:9px 13px;background:#25d366;color:#fff;border:none;border-radius:8px;font-size:16px;text-decoration:none;cursor:pointer;transition:background .2s}
.btn-wa:hover{background:#1ebe5c}
.btn-review{padding:9px 13px;background:#2a2a5a;color:#aad;border:none;border-radius:8px;font-size:14px;text-decoration:none;cursor:pointer;transition:background .2s}
.btn-review:hover{background:#3a3a7a}

/* RESEÑAS PÚBLICAS */
.reviews-section{margin-top:40px;padding-top:20px;border-top:1px solid #222}
.review-card{background:#1a1a1a;border:1px solid #252525;border-radius:10px;padding:14px;margin-bottom:10px}
.review-card .rv-name{font-size:13px;font-weight:700;color:#e63946}
.review-card .rv-text{font-size:13px;color:#ccc;margin-top:4px;line-height:1.5}
.review-card .rv-date{font-size:11px;color:#555;margin-top:6px}
.stars{color:#f4a261;font-size:14px;margin-top:2px}

/* MODAL RESEÑA */
#review-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:300;align-items:center;justify-content:center;padding:20px}
#review-modal.show{display:flex}
.modal-box{background:#1a1a1a;border:1px solid #333;border-radius:16px;padding:28px;width:100%;max-width:420px}
.modal-box h3{font-size:16px;font-weight:800;margin-bottom:16px}
.modal-close{float:right;background:none;border:none;color:#fff;font-size:22px;cursor:pointer;margin-top:-4px}
.star-pick{display:flex;gap:8px;font-size:28px;margin-bottom:16px;cursor:pointer}
.star-pick span{opacity:.3;transition:opacity .15s}
.star-pick span.on{opacity:1}
#review-text{width:100%;height:90px;padding:10px;background:#111;border:1px solid #333;border-radius:8px;color:#fff;font-size:14px;resize:none;outline:none}
#review-text:focus{border-color:#e63946}
.btn-review-send{width:100%;margin-top:12px;padding:13px;background:#e63946;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:800;cursor:pointer}

/* PANEL ADMIN */
#admin-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:400;align-items:flex-start;justify-content:center;padding:16px;overflow-y:auto}
#admin-modal.show{display:flex}
.admin-box{background:#1a1a1a;border:1px solid #333;border-radius:16px;padding:24px;width:100%;max-width:680px;margin:auto}
.admin-box h2{font-size:18px;font-weight:800;margin-bottom:20px}
.admin-close2{float:right;background:none;border:none;color:#fff;font-size:24px;cursor:pointer}
.admin-tabs{display:flex;gap:0;border:1px solid #333;border-radius:10px;overflow:hidden;margin-bottom:20px}
.atab{flex:1;padding:10px;background:#111;color:#777;border:none;cursor:pointer;font-size:13px;font-weight:700;transition:all .2s}
.atab.active{background:#e63946;color:#fff}
.admin-section{display:none}
.admin-section.active{display:block}
.a-row{display:flex;align-items:center;justify-content:space-between;background:#111;border-radius:8px;padding:12px 14px;margin-bottom:8px;gap:10px;flex-wrap:wrap}

.a-row-info .as{font-size:12px;color:#888;margin-top:2px}
.a-row-info .ap{font-size:11px;color:#e63946;margin-top:2px}
.btn-del{background:#7b0000;border:none;color:#fff;padding:6px 12px;border-radius:6px;font-size:12px;cursor:pointer}
.btn-del:hover{background:#c1121f}
.empty-msg{color:#555;font-size:13px;text-align:center;padding:24px}
.order-item{background:#111;border-radius:8px;padding:12px;margin-bottom:8px}

.order-item .oi-msg{font-size:12px;color:#888;margin-top:4px;font-style:italic}
.order-item .oi-date{font-size:11px;color:#555;margin-top:4px}

  .content{padding:14px 10px}
  .header{padding:10px 12px}

</head>

<div id="login-screen">

      </div>
  <div id="tab-reg" style="display:none">

    <div class="field"><label>CONTRASENA</label><input type="password" id="rps" placeholder="Minimo 4 caracteres" autocomplete="new-password"></div>
    <button type="button" class="btn-main" onclick="doRegister()">Crear cuenta</button>
      </div>
  <div id="login-err"></div>
</div>
</div>

<!-- APP -->
<div id="app">
  <div class="header">
    <div class="hdr-left"><span class="ico2">🎽</span><h2>Jerseys Premium</h2></div>
    <div class="hdr-right">
      <div class="uinfo"><div class="un" id="hdr-name"></div><div class="ur" id="hdr-role"></div></div>

      <button class="btn-sm btn-logout" onclick="doLogout()">Salir</button>
    </div>
  </div>
  <div class="content" id="main-content"></div>
  <div class="content">
    <div class="sec-title">Resenas de clientes</div>
    <div id="public-reviews"></div>
  </div>
</div>

<!-- MODAL RESENA -->
<div id="review-modal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeReview()">x</button>
    <h3>Deja tu resena</h3>
    <div class="star-pick" id="star-pick">
      <span onclick="setStar(1)">&#9733;</span>
      <span onclick="setStar(2)">&#9733;</span>
      <span onclick="setStar(3)">&#9733;</span>
      <span onclick="setStar(4)">&#9733;</span>
      <span onclick="setStar(5)">&#9733;</span>
    </div>
    <div class="field"><label>PRODUCTO</label><input type="text" id="rv-prod" placeholder="Que compraste?"></div>
    <textarea id="review-text" placeholder="Cuéntanos tu experiencia..."></textarea>
    <button class="btn-review-send" onclick="submitReview()">Publicar resena</button>
  </div>
</div>

<!-- PANEL ADMIN -->
<div id="admin-modal">
  <div class="admin-box">
    <button class="admin-close2" onclick="closeAdmin()">x</button>
    <h2>Panel de administracion</h2>
    <div class="admin-tabs">
      <button class="atab active" onclick="switchAdminTab('users')">Usuarios</button>
      <button class="atab" onclick="switchAdminTab('orders')">Pedidos</button>
      <button class="atab" onclick="switchAdminTab('reviews')">Resenas</button>
    </div>
    <div id="at-users" class="admin-section active"></div>
    <div id="at-orders" class="admin-section"></div>
    <div id="at-reviews" class="admin-section"></div>
  </div>
</div>

// STORAGE
function loadUsers(){ try{ return JSON.parse(localStorage.getItem('jpUsers')||'{}'); }catch(e){ return {}; } }
function saveUsers(u){ localStorage.setItem('jpUsers',JSON.stringify(u)); }
function loadOrders(){ try{ return JSON.parse(localStorage.getItem('jpOrders')||'[]'); }catch(e){ return []; } }
function saveOrders(o){ localStorage.setItem('jpOrders',JSON.stringify(o)); }
function loadReviews(){ try{ return JSON.parse(localStorage.getItem('jpReviews')||'[]'); }catch(e){ return []; } }
function saveReviews(r){ localStorage.setItem('jpReviews',JSON.stringify(r)); }
function getSession(){ try{ return JSON.parse(sessionStorage.getItem('jpSess')||'null'); }catch(e){ return null; } }
function setSession(s){ sessionStorage.setItem('jpSess',JSON.stringify(s)); }

// TABS LOGIN
function showTab(t){
  document.getElementById('tab-login').style.display = t==='login' ? '' : 'none';
  document.getElementById('tab-reg').style.display   = t==='reg'   ? '' : 'none';
  var btns = document.querySelectorAll('.tab-btn');
  btns[0].classList.toggle('active', t==='login');
  btns[1].classList.toggle('active', t==='reg');
  document.getElementById('login-err').textContent='';
}

// LOGIN
async function doLogin(){
  var ph = (document.getElementById('lph').value||'').trim();
  var ps = (document.getElementById('lps').value||'').trim();
  var err = document.getElementById('login-err');
  err.textContent='';
  if(ph.length<7){ err.textContent='Ingresa tu telefono.'; return; }
  if(!ps){ err.textContent='Ingresa tu contrasena.'; return; }
  var hash = await sha256(ps);
  if(ph===ADMIN_PHONE){
    if(hash!==ADMIN_PASS_HASH){ err.textContent='Contrasena incorrecta.'; return; }
    var s={phone:ADMIN_PHONE,name:ADMIN_NAME,role:'admin'};
    setSession(s); enterApp(s); return;
  }
  var users=loadUsers();
  if(!users[ph]){ err.textContent='Numero no registrado. Usa Registrarme.'; return; }
  if(users[ph].pass!==hash){
    if(users[ph].pass.length<64 && users[ph].pass===ps){
      users[ph].pass=hash; saveUsers(users);
      var s2={phone:ph,name:users[ph].name,role:users[ph].role||'user'};
      setSession(s2); enterApp(s2); return;
    }
    err.textContent='Contrasena incorrecta.'; return;
  }
  var s={phone:ph,name:users[ph].name,role:users[ph].role||'user'};
  setSession(s); enterApp(s);
}

// REGISTRO
async function doRegister(){
  var n  = (document.getElementById('rn').value||'').trim();
  var ph = (document.getElementById('rph').value||'').trim();
  var ps = (document.getElementById('rps').value||'').trim();
  var err = document.getElementById('login-err');
  err.textContent='';
  if(!n){ err.textContent='Ingresa tu nombre.'; return; }
  if(ph.length<7){ err.textContent='Ingresa tu telefono.'; return; }
  if(ps.length<4){ err.textContent='Contrasena minimo 4 caracteres.'; return; }
  if(ph===ADMIN_PHONE){ err.textContent='Numero no disponible.'; return; }
  var users=loadUsers();
  if(users[ph]){ err.textContent='Ya existe cuenta con ese numero.'; return; }
  var hash = await sha256(ps);
  users[ph]={name:n,pass:hash,role:'user',ts:new Date().toISOString()};
  saveUsers(users);
  var s={phone:ph,name:n,role:'user'};
  setSession(s); enterApp(s);
}

// ENTRAR APP
function enterApp(s){
  currentSess=s;
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('hdr-name').textContent=s.name;
  document.getElementById('hdr-role').textContent=s.role==='admin'?'Administrador':'Cliente';
  document.getElementById('btn-adm').style.display = s.role==='admin' ? '' : 'none';
  renderCatalog();
  renderPublicReviews();
}

// LOGOUT
function doLogout(){ sessionStorage.removeItem('jpSess'); location.reload(); }

// RENDER CATALOGO
function renderCatalog(){
  var html='';
  CATALOG.forEach(function(sec){
    html+='<div class="sec-title">'+sec.cat+'</div><div class="grid">';
    sec.items.forEach(function(it){
      var waMsg=encodeURIComponent('Hola, me interesa: '+it.name+'. Vi tu catalogo en jerseyspremium.com');
      var note=it.note?'<div class="card-note">'+it.note+'</div>':'';
      html+='<div class="card">'+
        '<div class="card-name">'+it.name+'</div>'+
        '<div class="card-cat">'+sec.cat+'</div>'+
        note+
        '<div class="card-btns">'+
          '<a class="btn-ver" href="'+it.url+'" target="_blank" rel="noopener">Ver catalogo</a>'+
          '<a class="btn-wa" href="https://wa.me/'+WA_NUMBER+'?text='+waMsg+'" target="_blank" rel="noopener">&#128172;</a>'+
          "<button class=\"btn-review\" onclick=\"openReview('"+it.name.replace(/'/g,'')+"')\">&#11088;</button>"+
        '</div>'+
      '</div>';
    });
    html+='</div>';
  });
  document.getElementById('main-content').innerHTML=html;
}

// RESENAS PUBLICAS
function renderPublicReviews(){
  var reviews=loadReviews();
  if(reviews.length===0){
    document.getElementById('public-reviews').innerHTML='<p style="color:#555;font-size:13px;padding:10px 0">Se el primero en dejar una resena.</p>';
    return;
  }
  var html='';
  reviews.slice().reverse().forEach(function(r){
    var stars='';
    for(var i=1;i<=5;i++) stars+='<span style="color:'+(i<=r.stars?'#f4a261':'#333')+'">&#9733;</span>';
    html+='<div class="review-card">'+
      '<div class="rv-name">'+r.name+'</div>'+
      '<div class="stars">'+stars+'</div>'+
      (r.product?'<div style="font-size:11px;color:#777;margin-top:2px">'+r.product+'</div>':'')+
      '<div class="rv-text">'+r.text+'</div>'+
      '<div class="rv-date">'+r.date+'</div>'+
    '</div>';
  });
  document.getElementById('public-reviews').innerHTML=html;
}

// MODAL RESENA
function openReview(prod){
  currentStar=0;
  document.getElementById('rv-prod').value=prod||'';
  document.getElementById('review-text').value='';
  updateStars();
  document.getElementById('review-modal').classList.add('show');
}
function closeReview(){ document.getElementById('review-modal').classList.remove('show'); }
function setStar(n){ currentStar=n; updateStars(); }
function updateStars(){
  var spans=document.querySelectorAll('#star-pick span');
  spans.forEach(function(s,i){ s.classList.toggle('on',i<currentStar); });
}
function submitReview(){
  var text=(document.getElementById('review-text').value||'').trim();
  var prod=(document.getElementById('rv-prod').value||'').trim();
  if(!text){ alert('Escribe tu resena.'); return; }
  if(currentStar===0){ alert('Elige una calificacion.'); return; }
  var reviews=loadReviews();
  reviews.push({
    name: currentSess?currentSess.name:'Anonimo',
    phone: currentSess?currentSess.phone:'',
    product: prod,
    text: text,
    stars: currentStar,
    date: new Date().toLocaleDateString('es-MX',{year:'numeric',month:'long',day:'numeric'})
  });
  saveReviews(reviews);
  closeReview();
  renderPublicReviews();
  alert('Resena publicada. Gracias!');
}

// ADMIN PANEL
function openAdmin(){
  switchAdminTab('users');
  document.getElementById('admin-modal').classList.add('show');
}
function closeAdmin(){ document.getElementById('admin-modal').classList.remove('show'); }
function switchAdminTab(tab){
  ['users','orders','reviews'].forEach(function(t){
    document.getElementById('at-'+t).classList.toggle('active',t===tab);
    document.querySelectorAll('.atab').forEach(function(b,i){
      b.classList.toggle('active',['users','orders','reviews'][i]===tab);
    });
  });
  if(tab==='users') renderAdminUsers();
  if(tab==='orders') renderAdminOrders();
  if(tab==='reviews') renderAdminReviews();
}

function renderAdminUsers(){
  var users=loadUsers();
  var keys=Object.keys(users);
  var isSuper = currentSess && currentSess.phone===ADMIN_PHONE;
  var html='<div style="font-size:12px;color:#666;margin-bottom:12px">Administrador principal + '+keys.length+' usuarios</div>';
  html+='<div class="a-row" style="border:1px solid #e63946">'+
    '<div class="a-row-info">'+
      '<div class="an">'+ADMIN_NAME+'</div>'+
      '<div class="as">Tel: '+ADMIN_PHONE+'</div>'+
      '<div class="ap" style="color:#e63946">Rol: admin (principal)</div>'+
    '</div>'+
  '</div>';
  if(keys.length===0){ document.getElementById('at-users').innerHTML=html+'<div class="empty-msg">Sin usuarios registrados.</div>'; return; }
  keys.forEach(function(ph){
    var u=users[ph];
    var fecha=u.ts?new Date(u.ts).toLocaleDateString('es-MX',{year:'numeric',month:'short',day:'numeric'}):'';
    var role=u.role||'user';
    var roleLabel=role==='admin'?'admin':'cliente';
    var roleColor=role==='admin'?'#e63946':'#888';
    html+='<div class="a-row">'+
      '<div class="a-row-info">'+
        '<div class="an">'+u.name+'</div>'+
        '<div class="as">Tel: '+ph+' | Registro: '+fecha+'</div>'+
        '<div class="ap" style="color:'+roleColor+'">Rol: '+roleLabel+'</div>'+
      '</div>';
    if(isSuper){
      if(role==='admin'){
        html+="<button class=\"btn-del\" style=\"background:#5a3a00\" onclick=\"demoteUser('"+ph+"')\">Quitar admin</button>";
      } else {
        html+="<button class=\"btn-del\" style=\"background:#1a5a1a\" onclick=\"promoteUser('"+ph+"')\">Hacer admin</button>";
      }
      html+="<button class=\"btn-del\" onclick=\"deleteUser('"+ph+"')\">Eliminar</button>";
    }
    html+='</div>';
  });
  document.getElementById('at-users').innerHTML=html;
}

function deleteUser(ph){
  if(!currentSess || currentSess.phone!==ADMIN_PHONE){ alert('Solo el administrador principal puede eliminar usuarios.'); return; }
  if(!confirm('Eliminar usuario '+ph+'?')) return;
  var users=loadUsers(); delete users[ph]; saveUsers(users); renderAdminUsers();
}

function promoteUser(ph){
  if(!currentSess || currentSess.phone!==ADMIN_PHONE){ alert('Solo el administrador principal puede cambiar roles.'); return; }
  var users=loadUsers();
  if(!users[ph]) return;
  users[ph].role='admin';
  saveUsers(users);
  renderAdminUsers();
}

function demoteUser(ph){
  if(!currentSess || currentSess.phone!==ADMIN_PHONE){ alert('Solo el administrador principal puede cambiar roles.'); return; }
  var users=loadUsers();
  if(!users[ph]) return;
  users[ph].role='user';
  saveUsers(users);
  renderAdminUsers();
}

function renderAdminOrders(){
  var orders=loadOrders();
  if(orders.length===0){ document.getElementById('at-orders').innerHTML='<div class="empty-msg">Sin pedidos aun.</div>'; return; }
  var html='<div style="font-size:12px;color:#666;margin-bottom:12px">'+orders.length+' pedidos</div>';
  orders.slice().reverse().forEach(function(o,i){
    html+='<div class="order-item">'+
      '<div class="oi-prod">'+o.product+'</div>'+
      '<div class="oi-user">Cliente: '+o.name+' | '+o.phone+'</div>'+
      (o.msg?'<div class="oi-msg">'+o.msg+'</div>':'')+
      '<div class="oi-date">'+o.date+'</div>'+
    '</div>';
  });
  document.getElementById('at-orders').innerHTML=html;
}

function renderAdminReviews(){
  var reviews=loadReviews();
  if(reviews.length===0){ document.getElementById('at-reviews').innerHTML='<div class="empty-msg">Sin resenas aun.</div>'; return; }
  var html='<div style="font-size:12px;color:#666;margin-bottom:12px">'+reviews.length+' resenas</div>';
  reviews.slice().reverse().forEach(function(r){
    var stars='';
    for(var i=1;i<=5;i++) stars+='<span style="color:'+(i<=r.stars?'#f4a261':'#333')+'">&#9733;</span>';
    html+='<div class="rv-admin">'+
      '<div class="ra-user">'+r.name+' ('+r.phone+')</div>'+
      '<div>'+stars+'</div>'+
      (r.product?'<div class="ra-prod">Producto: '+r.product+'</div>':'')+
      '<div class="ra-text">'+r.text+'</div>'+
      '<div class="ra-date">'+r.date+'</div>'+
      '<button class="btn-del" onclick="deleteReview('+reviews.indexOf(r)+')">Eliminar</button>'+
    '</div>';
  });
  document.getElementById('at-reviews').innerHTML=html;
}

function deleteReview(idx){
  var reviews=loadReviews(); reviews.splice(idx,1); saveReviews(reviews); renderAdminReviews(); renderPublicReviews();
}
